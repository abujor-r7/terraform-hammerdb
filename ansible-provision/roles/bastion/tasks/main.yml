- name: Install Python 3.9 on Amazon Linux 2023
  ansible.builtin.package:
    name: python3.9
    state: present

- name: Import MySQL GPG Key (General)
  ansible.builtin.rpm_key:
    key: https://repo.mysql.com/RPM-GPG-KEY-mysql
    state: present

- name: Import MySQL GPG Key (Amazon Linux 2023)
  ansible.builtin.rpm_key:
    key: https://repo.mysql.com/RPM-GPG-KEY-mysql-2023
    state: present

